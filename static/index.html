<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game API Frontend</title>

  <link href="style.css" rel="stylesheet">
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h1 {
      margin-bottom: 24px;
    }

    section {
      border: 1px solid #ccc;
      padding: 16px;
      margin-bottom: 24px;
      border-radius: 8px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input,
    button {
      padding: 10px;
      font-size: 16px;
    }

    pre {
      background: #f5f5f5;
      padding: 12px;
      overflow-x: auto;
      border-radius: 6px;
    }

    ul {
      padding-left: 20px;
    }
  </style>
</head>

<body>
  <h1>Game API Frontend</h1>

  <section>
    <h2>Players</h2>

    <button id="loadPlayersButton">
      Load Players
    </button>

    <ul id="playersList"></ul>
  </section>

  <section>
    <h2>Submit Game Result</h2>

    <form id="gameForm">
      <input type="text" id="player1" placeholder="Player 1" required />

      <input type="text" id="player2" placeholder="Player 2" required />

      <input type="number" step="0.5" id="result" placeholder="Result" required />

      <button type="submit">
        Submit
      </button>
    </form>

    <pre id="responseOutput"></pre>
  </section>

  <script>
    const API_BASE = "";

    async function loadPlayers() {
      const response = await fetch(
        `${API_BASE}/api/get_players`
      );

      const data = await response.json();

      const playersList = document.getElementById(
        "playersList"
      );

      playersList.innerHTML = "";

      for (const [name, rating] of Object.entries(data)) {
        const item = document.createElement("li");

        item.textContent = `${name}: ${rating}`;

        playersList.appendChild(item);
      }
    }

    async function submitGame(
      event
    ) {
      event.preventDefault();

      const player1 = document.getElementById(
        "player1"
      ).value;

      const player2 = document.getElementById(
        "player2"
      ).value;

      const result = document.getElementById(
        "result"
      ).value;

      const params = new URLSearchParams({
        player1,
        player2,
        result
      });

      const response = await fetch(
        `${API_BASE}/api/game?${params.toString()}`,
        {
          method: "POST"
        }
      );

      const data = await response.json();

      document.getElementById(
        "responseOutput"
      ).textContent = JSON.stringify(
        data,
        null,
        2
      );

      await loadPlayers();
    }

    document
      .getElementById("loadPlayersButton")
      .addEventListener(
        "click",
        loadPlayers
      );

    document
      .getElementById("gameForm")
      .addEventListener(
        "submit",
        submitGame
      );

    loadPlayers();
  </script>
</body>

</html>
