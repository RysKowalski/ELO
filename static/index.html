<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game API Frontend</title>

  <link href="style.css" rel="stylesheet">
</head>

<body>
  <section>
    <h2>Tablica wyników</h2>

    <ul id="playersList"></ul>
  </section>

  <section>
    <h2>Dodaj nową grę</h2>

    <form id="gameForm">
      <input type="text" id="player1" placeholder="Gracz 1" required />

      <input type="text" id="player2" placeholder="Gracz 2" required />

      <input type="number" step="0.5" id="result" placeholder="Wynik (0 / 0.5 / 1)" required />

      <button type="submit">
        Zatwierdź
      </button>
    </form>

    <pre id="responseOutput"></pre>
  </section>

  <script src="script.js"></script>
</body>

</html>
